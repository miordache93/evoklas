<p-card [header]="title()">
  <div class="placeholder">
    <div class="placeholder__pill">
      {{ 'APP.PAGES.PLACEHOLDER.PILL' | translate }}
    </div>
    <p class="placeholder__headline">
      {{ 'APP.PAGES.PLACEHOLDER.HEADLINE' | translate:{ title: title() } }}
    </p>
    <p class="placeholder__body">
      {{ 'APP.PAGES.PLACEHOLDER.BODY' | translate }}
    </p>
    <p-button
      routerLink="/dashboard"
      icon="pi pi-arrow-right"
      label="{{ 'APP.PAGES.PLACEHOLDER.CTA' | translate }}"
      [text]="true"
    ></p-button>
  </div>
</p-card>
